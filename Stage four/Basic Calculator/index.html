<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
    <input type="text" class="input">
    <div class="first-btn">
    <button class="del">DEL</button>
    <button class="add">+</button>
    <button class="sub">-</button>
    <button class="mul">*</button>
    </div>
    
    <div class="2nd-part">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    </div>

    <div class="3rd-part">
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    </div>
     
    <div class="4th-part">
    <button>9</button>
    <button class="divison">/</button>
    <button class="equal">=</button>
    <button class="clear">C</button>
    </div>
   </div>

</body>
</html>
